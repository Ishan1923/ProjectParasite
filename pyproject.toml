[project]
name = "projectparasite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "evdev>=2.0.0 ; sys_platform == 'linux'",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
projectparasite = "projectparasite:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
